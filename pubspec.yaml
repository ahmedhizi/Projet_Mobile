name: jarya
description: "jarya.tn - application mobile de suivi sportif, nutrition et garde-manger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Localisation (ar, en, fr) and date/number formatting
  intl: ^0.19.0

  # Shared: network calls, files, permissions, export
  http: ^1.2.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  share_plus: ^10.0.2

  # Module 1 - nutrition: barcode scanning (camera)
  mobile_scanner: ^5.2.1

  # Module 2 - workouts: accelerometer
  sensors_plus: ^6.0.1

  # Module 3 - profile: Bluetooth scale, charts, biometric lock
  flutter_blue_plus: '>=1.32.12 <1.35.0'
  fl_chart: ^0.69.0
  local_auth: ^2.3.0

  # Module 4 - routes: GPS and OpenStreetMap
  geolocator: ^13.0.1
  # 4.6.2+ needs a newer Flutter than 3.24; remove this pin after upgrading.
  geolocator_android: 4.6.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Module 5 - pantry_alerts: local notifications and Firebase Cloud Messaging
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # State management and SQLite packages are intentionally not chosen yet.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  # One images/ and one icons/ folder per module, plus common/ for shared files.
  assets:
    - assets/common/images/
    - assets/common/icons/
    - assets/dashboard/images/
    - assets/dashboard/icons/
    - assets/nutrition/images/
    - assets/nutrition/icons/
    - assets/workouts/images/
    - assets/workouts/icons/
    - assets/profile/images/
    - assets/profile/icons/
    - assets/routes/images/
    - assets/routes/icons/
    - assets/pantry_alerts/images/
    - assets/pantry_alerts/icons/

  fonts:
    # Latin script (English, French)
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
    # Arabic script (Tunisian Arabic)
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
